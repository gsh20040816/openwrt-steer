name: Publish tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified master artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Find successful build for tagged commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          run_id="$({
            gh api --paginate \
              "/repos/$REPOSITORY/actions/workflows/release.yml/runs?branch=master&status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$SOURCE_REVISION\" and .event == \"push\") | .id"
          } | head -n 1)"
          [ -n "$run_id" ] || {
            echo "No successful master build found for $SOURCE_REVISION" >&2
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using master build run $run_id for $SOURCE_REVISION"

      - name: Download exact release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo "$REPOSITORY" \
            --name release-bundle \
            --dir release-artifact

      - name: Download signed OpenWrt repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo "$REPOSITORY" \
            --name openwrt-repository \
            --dir repository-artifact

      - name: Verify release artifact
        id: release
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -- $(find release-artifact -type f -name SHA256SUMS)
          [ "$#" -eq 1 ] || {
            echo "Expected one release SHA256SUMS, found $#" >&2
            exit 1
          }
          release_dir="$(dirname "$1")"
          cd "$release_dir"
          sha256sum -c SHA256SUMS
          grep -Fqx "Source revision: $SOURCE_REVISION" BUILD-METADATA.txt
          for pattern in \
            'geoview-*.apk' \
            'steer-geodata-*.apk' \
            'steer-[0-9]*.apk' \
            'luci-app-steer-*.apk' \
            'luci-i18n-steer-zh-cn-*.apk' \
            'steer-linux-x86_64.tar.zst' \
            'steer-linux-aarch64.tar.zst'; do
            set -- $pattern
            [ "$#" -eq 1 ] && [ -f "$1" ] || {
              echo "Expected exactly one asset matching $pattern, found $#" >&2
              exit 1
            }
          done
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Verify signed OpenWrt repository
        id: repository
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -- $(find repository-artifact -type f -name packages.adb)
          [ "$#" -eq 1 ] || {
            echo "Expected one packages.adb, found $#" >&2
            exit 1
          }
          repository_dir="$(dirname "$1")"
          cd "$repository_dir"
          sha256sum -c SHA256SUMS
          grep -Fqx "Source revision: $SOURCE_REVISION" BUILD-METADATA.txt
          openssl pkey -pubin -in steer-apk.pem -noout
          for pattern in \
            'geoview-*.apk' \
            'steer-geodata-*.apk' \
            'steer-[0-9]*.apk' \
            'luci-app-steer-*.apk' \
            'luci-i18n-steer-zh-cn-*.apk'; do
            set -- $pattern
            [ "$#" -eq 1 ] && [ -f "$1" ] || {
              echo "Expected exactly one repository APK matching $pattern, found $#" >&2
              exit 1
            }
          done
          echo "repository_dir=$repository_dir" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="${{ steps.release.outputs.release_dir }}"
          release_flags=""
          case "$RELEASE_TAG" in
            *-*) release_flags="--prerelease" ;;
          esac
          gh release create "$RELEASE_TAG" "$release_dir"/* \
            --repo "$REPOSITORY" \
            --verify-tag \
            --generate-notes \
            $release_flags \
            --title "Steer $RELEASE_TAG"

      - name: Prepare stable repository site
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p site/openwrt/25.12.5/x86_64
          cp "${{ steps.repository.outputs.repository_dir }}"/* \
            site/openwrt/25.12.5/x86_64/
          cp repository/index.html site/index.html
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  pages:
    name: Deploy stable OpenWrt repository
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
