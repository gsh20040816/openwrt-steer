name: Build OpenWrt packages

on:
  workflow_dispatch:
    inputs:
      require_build_cache_hit:
        description: Fail unless the exact OpenWrt dependency cache is restored
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  x86_64:
    name: OpenWrt 25.12.5 x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check Simplified Chinese coverage
        run: python3 tests/check-luci-i18n.py

      - name: Check package ownership boundaries
        run: python3 tests/check-package-boundaries.py

      - name: Check build cache invariants
        run: python3 tests/check-build-cache.py

      - name: Check share URL parser
        run: node tests/node/share_url_test.js

      - name: Check LuCI view regressions
        run: node tests/node/luci_view_test.js

      - name: Check LuCI apply and status interactions
        run: node tests/node/steer_helper_test.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build cached OpenWrt SDK image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .github/actions/openwrt-sdk
          build-args: |
            SDK_IMAGE=ghcr.io/openwrt/sdk:x86_64-25.12.5@sha256:c8a248ce2411962a89f227db444bf5cea022829b049e6326c7d1032d9762982a
          tags: steer-sdk:25.12.5-x86_64
          cache-from: type=gha,scope=openwrt-sdk-25.12.5-x86_64
          cache-to: type=gha,mode=max,scope=openwrt-sdk-25.12.5-x86_64
          load: true

      - name: Restore OpenWrt dependency build cache
        id: openwrt-build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/steer-openwrt-cache/dl
            ${{ runner.temp }}/steer-openwrt-cache/build_dir-hostpkg
            ${{ runner.temp }}/steer-openwrt-cache/build_dir-target
            ${{ runner.temp }}/steer-openwrt-cache/staging_dir-hostpkg
            ${{ runner.temp }}/steer-openwrt-cache/staging_dir-target
            ${{ runner.temp }}/steer-openwrt-cache/tmp/go-build
          # Exact-only key: never restore target state from a different SDK,
          # feed set or dependency graph. Bump targetdeps-v1 whenever Steer's
          # DEPENDS/LUCI_DEPENDS selection changes.
          key: openwrt-build-v4-${{ runner.os }}-25.12.5-x86_64-c8a248ce-f0a60eee-5caa62e0-128a7812-targetdeps-v1

      - name: Report OpenWrt dependency cache result
        env:
          CACHE_HIT: ${{ steps.openwrt-build-cache.outputs.cache-hit }}
        run: |
          echo "Exact OpenWrt dependency cache hit: ${CACHE_HIT:-false}"

      - name: Require exact OpenWrt dependency cache hit
        if: ${{ inputs.require_build_cache_hit && steps.openwrt-build-cache.outputs.cache-hit != 'true' }}
        run: |
          echo 'The required exact OpenWrt dependency cache was not restored.' >&2
          exit 1

      - name: Build packages
        run: |
          cache_dir="$RUNNER_TEMP/steer-openwrt-cache"
          output_dir="$RUNNER_TEMP/steer-build-output"
          source_dir="$RUNNER_TEMP/steer-source"
          mkdir -p \
            "$cache_dir/dl" \
            "$cache_dir/build_dir-hostpkg" \
            "$cache_dir/build_dir-target" \
            "$cache_dir/staging_dir-hostpkg" \
            "$cache_dir/staging_dir-target" \
            "$cache_dir/tmp/go-build" \
            "$output_dir" \
            "$source_dir"
          # A checkout gives tracked files the checkout time. LuCI copies
          # those mtimes into APK v3 metadata, so build the local feed from a
          # git archive whose mtimes are fixed to the source commit.
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source_dir"
          chmod -R a+rwx "$cache_dir" "$output_dir"
          # The official SDK image ships a prepared kernel build tree and
          # target staging directory. A cold bind mount would hide that state
          # and make package/kernel/linux fail, so seed new target caches from
          # the pinned image before mounting them over /builder.
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/sh \
            --volume "$cache_dir:/cache" \
            steer-sdk:25.12.5-x86_64 \
            -c '
              set -eu
              if [ "${{ steps.openwrt-build-cache.outputs.cache-hit }}" != true ]; then
                cp -a /builder/build_dir/target-x86_64_musl/. /cache/build_dir-target/
                cp -a /builder/staging_dir/target-x86_64_musl/. /cache/staging_dir-target/
              fi
              chown -R "$(id -u buildbot):$(id -g buildbot)" /cache
            '
          docker run --rm \
            --env "STEER_BUILD_CACHE_HIT=${{ steps.openwrt-build-cache.outputs.cache-hit }}" \
            --volume "$source_dir:/feed:ro" \
            --volume "$output_dir:/artifacts" \
            --volume "$cache_dir/dl:/builder/dl" \
            --volume "$cache_dir/build_dir-hostpkg:/builder/build_dir/hostpkg" \
            --volume "$cache_dir/build_dir-target:/builder/build_dir/target-x86_64_musl" \
            --volume "$cache_dir/staging_dir-hostpkg:/builder/staging_dir/hostpkg" \
            --volume "$cache_dir/staging_dir-target:/builder/staging_dir/target-x86_64_musl" \
            --volume "$cache_dir/tmp:/builder/tmp" \
            steer-sdk:25.12.5-x86_64
          # The SDK builds as buildbot, but actions/cache archives as the
          # runner user. Some package staging files are mode 0600, so make
          # the finished cache readable without changing its ownership or
          # removing buildbot's write permissions for the next exact hit.
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/sh \
            --volume "$cache_dir:/cache" \
            steer-sdk:25.12.5-x86_64 \
            -c 'chmod -R a+rX /cache'
          cp -R "$output_dir/bin" "$GITHUB_WORKSPACE/bin"
          if [ -d "$output_dir/logs" ]; then
            cp -R "$output_dir/logs" "$GITHUB_WORKSPACE/logs"
          fi

      - name: Collect exact release assets
        env:
          GEOVIEW_REF: 3c91926d360b8f49d47520639e574608318baf12
          OPENWRT_RELEASE: 25.12.5
          OPENWRT_TARGET: x86/64
          SOURCE_REVISION: ${{ github.sha }}
        run: ./scripts/collect-release-artifacts.sh

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-25.12.5-x86_64-packages
          path: |
            dist/
            logs/
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "Steer $GITHUB_REF_NAME"
