name: Build OpenWrt packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  x86_64:
    name: OpenWrt 25.12.5 x86_64
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check Simplified Chinese coverage
        run: python3 tests/check-luci-i18n.py

      - name: Check package ownership boundaries
        run: python3 tests/check-package-boundaries.py

      - name: Check build cache invariants
        run: python3 tests/check-build-cache.py

      - name: Check share URL parser
        run: node tests/node/share_url_test.js

      - name: Check LuCI view regressions
        run: node tests/node/luci_view_test.js

      - name: Check LuCI apply and status interactions
        run: node tests/node/steer_helper_test.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build cached OpenWrt source and toolchain image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .github/actions/openwrt-builder
          build-args: |
            GO_BOOTSTRAP_IMAGE=docker.io/library/golang:1.26.4-bookworm@sha256:b305420a68d0f229d91eb3b3ed9e519fcf2cf5461da4bef997bf927e8c0bfd2b
            TOOLCHAIN_IMAGE=ghcr.io/openwrt/toolchain@sha256:16fe9150edb39da54b50f5d7e99e9baf0f2c9afb16183c54bfb07bc4e08b3b38
            OPENWRT_REF=f0a60eee2fe051741c643ea6118718aae1ef17fb
          tags: steer-openwrt-builder:25.12.5-x86_64
          cache-from: type=gha,scope=openwrt-builder-25.12.5-x86_64
          cache-to: type=gha,mode=max,scope=openwrt-builder-25.12.5-x86_64
          load: true

      - name: Restore OpenWrt package ccache
        id: openwrt-ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/steer-openwrt-ccache
          # Match OpenWrt's package-ccache boundary. The source and official
          # toolchain digests are part of the key; target state is never cached.
          key: openwrt-ccache-packages-v2-${{ runner.os }}-25.12.5-x86_64-f0a60eee-16fe9150

      - name: Report OpenWrt ccache result
        env:
          CACHE_HIT: ${{ steps.openwrt-ccache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.openwrt-ccache.outputs.cache-matched-key }}
        run: |
          echo "Exact OpenWrt ccache hit: ${CACHE_HIT:-false}"
          echo "Matched OpenWrt ccache key: ${MATCHED_KEY:-none}"

      - name: Build packages
        run: |
          ccache_dir="$RUNNER_TEMP/steer-openwrt-ccache"
          output_dir="$RUNNER_TEMP/steer-build-output"
          source_dir="$RUNNER_TEMP/steer-source"
          mkdir -p "$ccache_dir" "$output_dir" "$source_dir"
          # A checkout gives tracked files the checkout time. LuCI copies
          # those mtimes into APK v3 metadata, so build the local feed from a
          # git archive whose mtimes are fixed to the source commit.
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source_dir"
          chmod -R a+rwx "$ccache_dir" "$output_dir"
          docker run --rm \
            --env CCACHE_DIR=/work/openwrt/.ccache \
            --volume "$source_dir:/feed:ro" \
            --volume "$output_dir:/artifacts" \
            --volume "$ccache_dir:/work/openwrt/.ccache" \
            steer-openwrt-builder:25.12.5-x86_64
          # The builder runs as buildbot, while actions/cache archives as runner.
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/sh \
            --volume "$ccache_dir:/cache" \
            steer-openwrt-builder:25.12.5-x86_64 \
            -c 'chmod -R a+rX /cache'
          cp -R "$output_dir/bin" "$GITHUB_WORKSPACE/bin"
          if [ -d "$output_dir/logs" ]; then
            cp -R "$output_dir/logs" "$GITHUB_WORKSPACE/logs"
          fi

      - name: Delete previously restored OpenWrt ccache
        if: ${{ steps.openwrt-ccache.outputs.cache-hit == 'true' }}
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        with:
          route: DELETE /repos/{repository}/actions/caches?key={key}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_KEY: ${{ steps.openwrt-ccache.outputs.cache-primary-key }}

      - name: Save OpenWrt package ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/steer-openwrt-ccache
          key: ${{ steps.openwrt-ccache.outputs.cache-primary-key }}

      - name: Collect exact release assets
        env:
          GEOVIEW_REF: 3c91926d360b8f49d47520639e574608318baf12
          OPENWRT_RELEASE: 25.12.5
          OPENWRT_TARGET: x86/64
          SOURCE_REVISION: ${{ github.sha }}
        run: ./scripts/collect-release-artifacts.sh

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-25.12.5-x86_64-packages
          path: |
            dist/
            logs/
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "Steer $GITHUB_REF_NAME"
