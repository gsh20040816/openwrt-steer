name: Build OpenWrt packages

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: openwrt-package-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  x86_64:
    name: OpenWrt 25.12.5 x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check Simplified Chinese coverage
        run: python3 tests/check-luci-i18n.py

      - name: Check package ownership boundaries
        run: python3 tests/check-package-boundaries.py

      - name: Check official SDK workflow invariants
        run: python3 tests/check-build-cache.py

      - name: Check share URL parser
        run: node tests/node/share_url_test.js

      - name: Check LuCI view regressions
        run: node tests/node/luci_view_test.js

      - name: Check LuCI apply and status interactions
        run: node tests/node/steer_helper_test.js

      - name: Prepare official SDK artifacts directory
        run: |
          mkdir -p "$RUNNER_TEMP/steer-sdk-artifacts"
          mkdir -p "$RUNNER_TEMP/steer-sdk-dl"
          mkdir -p "$RUNNER_TEMP/steer-sdk-ccache"
          mkdir -p "$RUNNER_TEMP/steer-sdk-go-cache"
          chmod -R a+rwx \
            "$RUNNER_TEMP/steer-sdk-artifacts" \
            "$RUNNER_TEMP/steer-sdk-dl" \
            "$RUNNER_TEMP/steer-sdk-ccache" \
            "$RUNNER_TEMP/steer-sdk-go-cache"

      - name: Restore OpenWrt SDK ccache
        id: sdk-ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/steer-sdk-ccache
          key: openwrt-sdk-ccache-v1-${{ runner.os }}-x86_64-c8a248ce-${{ github.sha }}
          restore-keys: |
            openwrt-sdk-ccache-v1-${{ runner.os }}-x86_64-c8a248ce-

      - name: Restore OpenWrt Go build cache
        id: sdk-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/steer-sdk-go-cache
          key: openwrt-sdk-gocache-v1-${{ runner.os }}-x86_64-go1.26.4-5caa62e0-${{ github.sha }}
          restore-keys: |
            openwrt-sdk-gocache-v1-${{ runner.os }}-x86_64-go1.26.4-5caa62e0-

      - name: Build packages with official OpenWrt SDK
        run: |
          source_dir="$RUNNER_TEMP/steer-source"
          mkdir -p "$source_dir"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source_dir"
          docker run --rm \
            --volume "$source_dir:/feed:ro" \
            --volume "$RUNNER_TEMP/steer-sdk-artifacts:/artifacts" \
            --volume "$RUNNER_TEMP/steer-sdk-dl:/builder/dl" \
            --volume "$RUNNER_TEMP/steer-sdk-ccache:/builder/.ccache" \
            --volume "$RUNNER_TEMP/steer-sdk-go-cache:/go-build-cache" \
            --volume "$GITHUB_WORKSPACE/.github/actions/openwrt-sdk/entrypoint.sh:/entrypoint.sh:ro" \
            --env FEEDNAME=steer \
            --env ARTIFACTS_DIR=/artifacts \
            --env PACKAGES="geoview steer-geodata steer-openwrt luci-app-steer" \
            --env BUILD_LOG=1 \
            --env V=s \
            ghcr.io/openwrt/sdk@sha256:c8a248ce2411962a89f227db444bf5cea022829b049e6326c7d1032d9762982a \
            /bin/sh /entrypoint.sh

      - name: Collect SDK artifacts
        run: |
          cp -R "$RUNNER_TEMP/steer-sdk-artifacts/bin" "$GITHUB_WORKSPACE/bin"
          if [ -d "$RUNNER_TEMP/steer-sdk-artifacts/logs" ]; then
            cp -R "$RUNNER_TEMP/steer-sdk-artifacts/logs" "$GITHUB_WORKSPACE/logs"
          fi

      - name: Collect exact release assets
        env:
          GEOVIEW_REF: 3c91926d360b8f49d47520639e574608318baf12
          OPENWRT_RELEASE: 25.12.5
          OPENWRT_TARGET: x86/64
          SOURCE_REVISION: ${{ github.sha }}
        run: ./scripts/collect-release-artifacts.sh

      - name: Save OpenWrt SDK ccache
        if: success() && steps.sdk-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/steer-sdk-ccache
          key: ${{ steps.sdk-ccache.outputs.cache-primary-key }}

      - name: Save OpenWrt Go build cache
        if: success() && steps.sdk-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/steer-sdk-go-cache
          key: ${{ steps.sdk-go-cache.outputs.cache-primary-key }}

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-25.12.5-x86_64-packages
          path: |
            dist/
            logs/
          if-no-files-found: error
          retention-days: 30
