name: macOS preview checks

on:
  push:
    paths:
      - 'go/**'
      - 'macos/**'
      - 'docs/MACOS.md'
      - 'tests/check-macos-contract.py'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'macos/**'
      - 'docs/MACOS.md'
      - 'tests/check-macos-contract.py'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Shared Go and static contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check macOS source contracts
        run: |
          python3 tests/check-macos-contract.py
          sh -n macos/scripts/install-launchdaemon.sh
      - name: Test shared Go core
        working-directory: go
        run: |
          go test -race ./...
          go vet ./...

      - name: Build supported macOS helper
        working-directory: go
        run: go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/steer-macos" ./cmd/steer-macos

  native-source:
    name: Native GUI source build
    runs-on: macos-14
    needs: core
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build Swift package without signing
        working-directory: macos
        run: |
          plutil -lint launchd/com.steer.steer.plist
          swift build --disable-sandbox
